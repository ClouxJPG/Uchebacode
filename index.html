
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>StormLab — Supercell Simulator</title>
<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#090d14;color:#e6edf7;
 font-family:Arial,Helvetica,sans-serif
}
canvas{display:block}
#screen{position:fixed;inset:0}
#ui{
 position:fixed;left:12px;top:12px;bottom:12px;
 width:310px;max-width:calc(100vw - 24px);
 overflow:auto;background:rgba(10,16,25,.88);
 backdrop-filter:blur(12px);
 border:1px solid #273546;border-radius:13px;
 padding:15px;z-index:5;
 transition:transform .25s
}
#ui.hidden{transform:translateX(-110%)}
h1{font-size:20px;margin:0 0 5px;letter-spacing:1px}
.sub{font-size:11px;color:#8298b2;margin-bottom:18px}
.section{
 font-size:11px;color:#6ca8df;font-weight:bold;
 letter-spacing:1.3px;margin:18px 0 10px
}
label{font-size:12px;color:#c4d0df}
.row{
 display:flex;justify-content:space-between;
 align-items:center;margin:11px 0 6px
}
input[type=range]{width:100%;accent-color:#65a8ff}
select,button{
 background:#152232;color:#e5edf7;border:1px solid #31465e;
 border-radius:7px;padding:9px;font-size:12px
}
select{width:100%}
button{cursor:pointer}
button:active{background:#24446a}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px}
#toggle{
 position:fixed;z-index:10;top:12px;right:12px;
 padding:10px 13px;background:#132235
}
#info{
 position:fixed;right:12px;bottom:12px;z-index:3;
 color:#a9b9cb;background:rgba(10,16,25,.65);
 padding:9px 12px;border-radius:8px;font-size:11px
}
.value{color:#78b9ff;font-variant-numeric:tabular-nums}
hr{border:0;border-top:1px solid #253343;margin:15px 0}
</style>
</head>
<body>
<div id="screen"></div>

<button id="toggle">☰</button>

<div id="ui">
<h1>STORMLAB</h1>
<div class="sub">PROCEDURAL CONVECTIVE SIMULATION</div>

<div class="section">РЕНДЕРИНГ</div>

<div class="row">
<label>Качество</label>
</div>
<select id="quality">
<option value="0">Экономное</option>
<option value="1">Низкое</option>
<option value="2">Среднее</option>
<option value="3" selected>Высокое</option>
<option value="4">Ультра</option>
<option value="5">Экстремальное</option>
<option value="6">Максимальное</option>
<option value="7">Без ограничений</option>
</select>

<div class="row">
<label>Разрешение</label>
<span class="value" id="resV"></span>
</div>
<input id="resolution" type="range" min="0.5" max="2.5" step="0.1" value="1">

<div class="row">
<label>Шаги объёма</label>
<span class="value" id="stepsV"></span>
</div>
<input id="steps" type="range" min="32" max="240" step="8" value="128">

<div class="row">
<label>Детализация шума</label>
<span class="value" id="detailV"></span>
</div>
<input id="detail" type="range" min="2" max="12" step="1" value="7">

<div class="row">
<label>Размер облачных деталей</label>
<span class="value" id="scaleV"></span>
</div>
<input id="scale" type="range" min="1" max="8" step=".1" value="3.5">

<div class="row">
<label>Плотность</label>
<span class="value" id="densityV"></span>
</div>
<input id="density" type="range" min=".2" max="3" step=".05" value="1.35">

<div class="row">
<label>Контраст</label>
<span class="value" id="contrastV"></span>
</div>
<input id="contrast" type="range" min=".3" max="2.5" step=".05" value="1.25">

<div class="section">СТРУКТУРА ГРОЗЫ</div>

<div class="row">
<label>Вертикальный масштаб</label>
<span class="value" id="heightV"></span>
</div>
<input id="height" type="range" min=".5" max="2" step=".05" value="1">

<div class="row">
<label>Ширина наковальни</label>
<span class="value" id="anvilV"></span>
</div>
<input id="anvil" type="range" min=".4" max="2" step=".05" value="1">

<div class="row">
<label>Выраженность башни</label>
<span class="value" id="towerV"></span>
</div>
<input id="tower" type="range" min=".5" max="2" step=".05" value="1.2">

<div class="row">
<label>Освещение</label>
<span class="value" id="lightV"></span>
</div>
<input id="light" type="range" min="0" max="2" step=".05" value="1">

<div class="row">
<label>Направление света</label>
</div>
<select id="sun">
<option value="0">Слева</option>
<option value="1" selected>Справа</option>
<option value="2">Сзади</option>
<option value="3">Спереди</option>
<option value="4">Сверху</option>
</select>

<div class="section">АТМОСФЕРА</div>

<div class="row">
<label>Цвет неба</label>
</div>
<select id="sky">
<option value="0">Дневное</option>
<option value="1" selected>Штормовое</option>
<option value="2">Сумерки</option>
<option value="3">Ночное</option>
<option value="4">Свинцовый фронт</option>
</select>

<div class="row">
<label>Скорость ветра</label>
<span class="value" id="windV"></span>
</div>
<input id="wind" type="range" min="0" max="2" step=".05" value=".25">

<div class="row">
<label>Анимация</label>
</div>
<select id="animate">
<option value="1" selected>Включена</option>
<option value="0">Заморожена</option>
</select>

<div class="section">КАМЕРА</div>
<div class="buttons">
<button id="reset">Сброс камеры</button>
<button id="fullscreen">Полный экран</button>
</div>
<div class="buttons" style="margin-top:8px">
<button id="zoomIn">Приблизить</button>
<button id="zoomOut">Отдалить</button>
</div>

<hr>
<div style="font-size:11px;color:#8195ab;line-height:1.6">
Перемещай камеру удержанием пальца или мыши.
Приближение — колесо мыши или жест двумя пальцами.
Изменение качества пересоздаёт буфер рендеринга.
</div>
</div>

<div id="info">STORMLAB · GPU VOLUME</div>

<script type="module">
import * as THREE from
'https://esm.sh/three@0.180.0';

const root=document.getElementById('screen');

const renderer=new THREE.WebGLRenderer({
 antialias:false,
 alpha:false,
 powerPreference:'high-performance'
});

renderer.setPixelRatio(1);
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.NoToneMapping;
root.appendChild(renderer.domElement);

const scene=new THREE.Scene();

const geo=new THREE.PlaneGeometry(2,2);

const vertex=`
varying vec2 vUv;
void main(){
 vUv=uv;
 gl_Position=vec4(position,1.0);
}
`;

const fragment=`
precision highp float;

varying vec2 vUv;

uniform vec2 uResolution;
uniform float uTime;
uniform float uSteps;
uniform float uDetail;
uniform float uScale;
uniform float uDensity;
uniform float uContrast;
uniform float uHeight;
uniform float uAnvil;
uniform float uTower;
uniform float uLight;
uniform float uWind;
uniform float uAnimate;
uniform int uSky;
uniform int uSun;

uniform vec3 uCam;
uniform vec3 uRight;
uniform vec3 uUp;
uniform vec3 uForward;

const float PI=3.14159265;

float hash(vec3 p){
 p=fract(p*.3183099+vec3(.1,.2,.3));
 p*=17.0;
 return fract(p.x*p.y*p.z*(p.x+p.y+p.z));
}

float noise(vec3 p){
 vec3 i=floor(p);
 vec3 f=fract(p);
 f=f*f*(3.0-2.0*f);

 float n000=hash(i);
 float n100=hash(i+vec3(1,0,0));
 float n010=hash(i+vec3(0,1,0));
 float n110=hash(i+vec3(1,1,0));
 float n001=hash(i+vec3(0,0,1));
 float n101=hash(i+vec3(1,0,1));
 float n011=hash(i+vec3(0,1,1));
 float n111=hash(i+vec3(1,1,1));

 return mix(
  mix(mix(n000,n100,f.x),mix(n010,n110,f.x),f.y),
  mix(mix(n001,n101,f.x),mix(n011,n111,f.x),f.y),
  f.z
 );
}

float fbm(vec3 p,float octaves){
 float sum=0.0;
 float amp=.5;
 float norm=0.0;

 for(int i=0;i<12;i++){
  if(float(i)>=octaves)break;
  sum+=noise(p)*amp;
  norm+=amp;
  p*=2.02;
  amp*=.5;
 }

 return sum/max(norm,.001);
}

float sdEllipsoid(vec3 p,vec3 r){
 float k0=length(p/r);
 float k1=length(p/(r*r));
 return k0*(k0-1.0)/max(k1,.0001);
}

// Крупная структура суперячейки
float shapeField(vec3 p){

 float h=p.y;
 float heightScale=uHeight;

 // Основание конвективной системы
 float base=sdEllipsoid(
  p-vec3(0,1.4*heightScale,0),
  vec3(2.25,1.3*heightScale,2.05)
 );

 // Мощная вертикальная башня
 float tower=sdEllipsoid(
  p-vec3(.12,4.1*heightScale,0),
  vec3(1.35*uTower,3.7*heightScale,1.3*uTower)
 );

 // Верхняя расширяющаяся часть
 float upper=sdEllipsoid(
  p-vec3(0,7.1*heightScale,0),
  vec3(2.0,2.5*heightScale,1.8)
 );

 // Наковальня
 float anvil=sdEllipsoid(
  p-vec3(0,8.5*heightScale,-.65),
  vec3(3.8*uAnvil,1.15*heightScale,2.7*uAnvil)
 );

 // Обширный горизонтальный слой наковальни
 float spreading=sdEllipsoid(
  p-vec3(0,9.05*heightScale,-1.2),
  vec3(5.0*uAnvil,.7*heightScale,3.1*uAnvil)
 );

 float d=min(base,tower);
 d=min(d,upper);
 d=min(d,anvil);
 d=min(d,spreading);

 // Нижние облачные массы
 float lower=sdEllipsoid(
  p-vec3(-1.1,.9*heightScale,.5),
  vec3(2.8,1.15*heightScale,2.4)
 );

 d=min(d,lower);

 // Области расширения наковальни
 float side1=sdEllipsoid(
  p-vec3(2.9,8.6*heightScale,-.8),
  vec3(3.2*uAnvil,.85*heightScale,2.4)
 );

 float side2=sdEllipsoid(
  p-vec3(-2.8,8.65*heightScale,-.8),
  vec3(3.2*uAnvil,.85*heightScale,2.4)
 );

 d=min(d,side1);
 d=min(d,side2);

 return d;
}

vec3 skyColor(float y){

 vec3 dayTop=vec3(.24,.48,.78);
 vec3 dayBottom=vec3(.68,.78,.87);

 vec3 stormTop=vec3(.08,.12,.19);
 vec3 stormBottom=vec3(.38,.43,.48);

 vec3 duskTop=vec3(.12,.12,.3);
 vec3 duskBottom=vec3(.8,.35,.24);

 vec3 nightTop=vec3(.008,.015,.04);
 vec3 nightBottom=vec3(.045,.07,.13);

 vec3 frontTop=vec3(.07,.09,.12);
 vec3 frontBottom=vec3(.24,.29,.33);

 float t=clamp(y*.5+.5,0.,1.);

 if(uSky==0)return mix(dayBottom,dayTop,t);
 if(uSky==1)return mix(stormBottom,stormTop,t);
 if(uSky==2)return mix(duskBottom,duskTop,t);
 if(uSky==3)return mix(nightBottom,nightTop,t);

 return mix(frontBottom,frontTop,t);
}

vec3 lightDirection(){

 if(uSun==0)return normalize(vec3(-1,.35,.6));
 if(uSun==1)return normalize(vec3(1,.35,.6));
 if(uSun==2)return normalize(vec3(0,.3,-1));
 if(uSun==3)return normalize(vec3(0,.3,1));

 return normalize(vec3(0,1,0));
}

float densityAt(vec3 p){

 float d=shapeField(p);

 // Форма крупных масс
 float shape=clamp(1.0-d*.5,0.0,1.0);
 shape=smoothstep(.05,.85,shape);

 if(shape<=0.001)return 0.0;

 vec3 windOffset=vec3(
  uTime*uWind*.15,
  uTime*uWind*.025,
  uTime*uWind*.1
 );

 vec3 q=p*uScale+windOffset;

 // Структурные неоднородности
 float coarse=fbm(q*.38,4.0);
 float mid=fbm(q*1.1,5.0);
 float fine=fbm(q*2.4,uDetail);

 float erosion=coarse*.42+mid*.32+fine*.26;

 // Неоднородный край и внутренняя структура
 float cloud=shape*(.7+erosion*.65);

 cloud-= (1.0-shape)*.15;
 cloud-= (1.0-fine)*.12;

 cloud*=uDensity;
 cloud=clamp(cloud,0.0,1.0);

 return pow(cloud,uContrast);
}

void main(){

 vec2 uv=(gl_FragCoord.xy/uResolution)*2.0-1.0;

 uv.x*=uResolution.x/uResolution.y;

 vec3 ray=normalize(
  uForward+uRight*uv.x+uUp*uv.y
 );

 vec3 bg=skyColor(ray.y);

 // Дальняя атмосферная дымка
 bg+=vec3(.015,.02,.025)*max(ray.y,0.);

 // Пересечение с ограничивающей областью облака
 vec3 boxCenter=vec3(0,5.0*uHeight,0);
 vec3 boxSize=vec3(7.5*uAnvil,11.0*uHeight,6.0*uAnvil);

 vec3 ro=uCam-boxCenter;
 vec3 invDir=1.0/ray;

 vec3 t0=(-boxSize-ro)*invDir;
 vec3 t1=(boxSize-ro)*invDir;

 vec3 tmin=min(t0,t1);
 vec3 tmax=max(t0,t1);

 float nearT=max(max(tmin.x,tmin.y),tmin.z);
 float farT=min(min(tmax.x,tmax.y),tmax.z);

 if(farT<=max(nearT,0.0)){
  gl_FragColor=vec4(bg,1.);
  return;
 }

 float start=max(nearT,0.0);
 float end=farT;

 float stepSize=(end-start)/uSteps;

 float transmittance=1.0;
 vec3 color=vec3(0);

 vec3 sun=lightDirection();

 // Счётчик raymarch
 for(int i=0;i<240;i++){

  if(float(i)>=uSteps)break;

  float t=start+(float(i)+.5)*stepSize;
  vec3 p=uCam+ray*t;

  float dens=densityAt(p);

  if(dens>.001){

   // Приближённое освещение внутренней структуры
   float sampleDist=.35;

   float dLight=densityAt(p+sun*sampleDist);
   float dLight2=densityAt(p+sun*sampleDist*2.0);

   float shadow=clamp(
    dLight*.65+dLight2*.3,
    0.,1.
   );

   float illumination=1.0-shadow*.65;

   // Освещение верхних частей облака
   illumination+=max(dot(sun,vec3(0,1,0)),0.)*.15;

   vec3 cloudBase=vec3(.48,.52,.57);
   vec3 cloudLit=vec3(.93,.95,.98);

   vec3 cloudColor=mix(
    cloudBase,
    cloudLit,
    clamp(illumination,0.,1.)
   );

   // Внутренние тёмные участки
   cloudColor*=1.0-dens*.24;

   // Поглощение
   float absorption=dens*stepSize*.16;

   float alpha=1.0-exp(-absorption);

   alpha*=uLight;

   color+=cloudColor*alpha*transmittance;

   transmittance*=1.0-alpha;

   if(transmittance<.015)break;
  }
 }

 color+=bg*transmittance;

 // Тонкая атмосферная коррекция
 color=pow(max(color,vec3(0.)),vec3(.95));

 gl_FragColor=vec4(color,1.);
}
`;

const uniforms={
 uResolution:{value:new THREE.Vector2(innerWidth,innerHeight)},
 uTime:{value:0},
 uSteps:{value:128},
 uDetail:{value:7},
 uScale:{value:3.5},
 uDensity:{value:1.35},
 uContrast:{value:1.25},
 uHeight:{value:1},
 uAnvil:{value:1},
 uTower:{value:1.2},
 uLight:{value:1},
 uWind:{value:.25},
 uAnimate:{value:1},
 uSky:{value:1},
 uSun:{value:1},
 uCam:{value:new THREE.Vector3(0,5,19)},
 uRight:{value:new THREE.Vector3(1,0,0)},
 uUp:{value:new THREE.Vector3(0,1,0)},
 uForward:{value:new THREE.Vector3(0,0,-1)}
};

const material=new THREE.ShaderMaterial({
 uniforms,
 vertexShader:vertex,
 fragmentShader:fragment
});

const mesh=new THREE.Mesh(geo,material);
scene.add(mesh);

let yaw=0;
let pitch=.12;
let distance=19;

const target=new THREE.Vector3(0,5,0);

function updateCamera(){

 const cp=Math.cos(pitch);
 const sp=Math.sin(pitch);

 const forward=new THREE.Vector3(
  Math.sin(yaw)*cp,
  sp,
  -Math.cos(yaw)*cp
 );

 const right=new THREE.Vector3(
  Math.cos(yaw),
  0,
  Math.sin(yaw)
 );

 const up=new THREE.Vector3().crossVectors(
  right,forward
 ).normalize();

 const camera=target.clone().add(
  forward.clone().negate().multiplyScalar(distance)
 );

 uniforms.uCam.value.copy(camera);
 uniforms.uRight.value.copy(right);
 uniforms.uUp.value.copy(up);
 uniforms.uForward.value.copy(forward);
}

updateCamera();

// Управление камерой
let dragging=false;
let lastX=0;
let lastY=0;

renderer.domElement.addEventListener('pointerdown',e=>{
 dragging=true;
 lastX=e.clientX;
 lastY=e.clientY;
 renderer.domElement.setPointerCapture(e.pointerId);
});

renderer.domElement.addEventListener('pointerup',()=>{
 dragging=false;
});

renderer.domElement.addEventListener('pointercancel',()=>{
 dragging=false;
});

renderer.domElement.addEventListener('pointermove',e=>{
 if(!dragging)return;

 const dx=e.clientX-lastX;
 const dy=e.clientY-lastY;

 lastX=e.clientX;
 lastY=e.clientY;

 yaw-=dx*.005;
 pitch+=dy*.005;

 pitch=Math.max(-1.45,Math.min(1.45,pitch));

 updateCamera();
});

renderer.domElement.addEventListener('wheel',e=>{
 distance*=e.deltaY>0?1.1:.9;
 distance=Math.max(6,Math.min(60,distance));
 updateCamera();
},{passive:true});

// Кнопки
document.getElementById('reset').onclick=()=>{
 yaw=0;
 pitch=.12;
 distance=19;
 updateCamera();
};

document.getElementById('zoomIn').onclick=()=>{
 distance=Math.max(6,distance*.85);
 updateCamera();
};

document.getElementById('zoomOut').onclick=()=>{
 distance=Math.min(60,distance*1.15);
 updateCamera();
};

document.getElementById('fullscreen').onclick=()=>{
 if(!document.fullscreenElement)
  document.documentElement.requestFullscreen?.();
 else
  document.exitFullscreen?.();
};

document.getElementById('toggle').onclick=()=>{
 document.getElementById('ui').classList.toggle('hidden');
};

// Качество
const presets=[
 {steps:40,detail:3,res:.65},
 {steps:64,detail:4,res:.8},
 {steps:88,detail:5,res:1},
 {steps:128,detail:7,res:1},
 {steps:160,detail:9,res:1.2},
 {steps:200,detail:11,res:1.5},
 {steps:240,detail:12,res:1.8},
 {steps:240,detail:12,res:2.2}
];

const quality=document.getElementById('quality');
const resolution=document.getElementById('resolution');
const steps=document.getElementById('steps');
const detail=document.getElementById('detail');

function applyPreset(){

 const p=presets[Number(quality.value)];

 steps.value=p.steps;
 detail.value=p.detail;
 resolution.value=p.res;

 updateValues();
}

quality.addEventListener('change',applyPreset);

function updateValues(){

 uniforms.uSteps.value=Number(steps.value);
 uniforms.uDetail.value=Number(detail.value);
 uniforms.uScale.value=Number(document.getElementById('scale').value);
 uniforms.uDensity.value=Number(document.getElementById('density').value);
 uniforms.uContrast.value=Number(document.getElementById('contrast').value);
 uniforms.uHeight.value=Number(document.getElementById('height').value);
 uniforms.uAnvil.value=Number(document.getElementById('anvil').value);
 uniforms.uTower.value=Number(document.getElementById('tower').value);
 uniforms.uLight.value=Number(document.getElementById('light').value);
 uniforms.uWind.value=Number(document.getElementById('wind').value);
 uniforms.uSky.value=Number(document.getElementById('sky').value);
 uniforms.uSun.value=Number(document.getElementById('sun').value);
 uniforms.uAnimate.value=Number(document.getElementById('animate').value);

 const scale=Number(resolution.value);
 renderer.setSize(innerWidth,innerHeight);

 const effective=Math.min(
  innerWidth*scale,
  4096
 );

 const effectiveHeight=Math.min(
  innerHeight*scale,
  4096
 );

 renderer.setSize(effective,effectiveHeight,false);

 uniforms.uResolution.value.set(
  effective,effectiveHeight
 );

 document.getElementById('resV').textContent=scale.toFixed(1)+'×';
 document.getElementById('stepsV').textContent=steps.value;
 document.getElementById('detailV').textContent=detail.value;
 document.getElementById('scaleV').textContent=document.getElementById('scale').value;
 document.getElementById('densityV').textContent=document.getElementById('density').value;
 document.getElementById('contrastV').textContent=document.getElementById('contrast').value;
 document.getElementById('heightV').textContent=document.getElementById('height').value;
 document.getElementById('anvilV').textContent=document.getElementById('anvil').value;
 document.getElementById('towerV').textContent=document.getElementById('tower').value;
 document.getElementById('lightV').textContent=document.getElementById('light').value;
 document.getElementById('windV').textContent=document.getElementById('wind').value;
}

document.querySelectorAll('input,select').forEach(el=>{
 el.addEventListener('input',updateValues);
 el.addEventListener('change',updateValues);
});

applyPreset();
updateCamera();

let startTime=performance.now();
let frameCount=0;
let fps=0;
let lastFPS=performance.now();

function animateFrame(now){

 requestAnimationFrame(animateFrame);

 if(uniforms.uAnimate.value===1){
  uniforms.uTime.value=(now-startTime)/1000;
 }

 renderer.render(scene,mesh);

 frameCount++;

 if(now-lastFPS>1000){
  fps=frameCount;
  frameCount=0;
  lastFPS=now;

  document.getElementById('info').textContent=
   'STORMLAB · '+fps+' FPS · '+steps.value+' STEPS';
 }
}

requestAnimationFrame(animateFrame);

window.addEventListener('resize',()=>{
 updateValues();
 updateCamera();
});

</script>
</body>
</html>
