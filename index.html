<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>StormLab — No WebGL</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111827;color:#edf2f7;font-family:system-ui}canvas{width:100%;height:100%;display:block;touch-action:none}#top{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}#top>*{pointer-events:auto}.btn{background:#152333e8;color:#edf2f7;border:1px solid #465a70;border-radius:12px;padding:11px 14px;font-size:15px}#panel{position:fixed;right:12px;top:62px;width:min(330px,calc(100vw - 24px));max-height:calc(100dvh - 105px);overflow:auto;background:#101925f2;border:1px solid #35465a;border-radius:16px;padding:14px;transition:.2s}#panel.hide{transform:translateX(110%);opacity:0;pointer-events:none}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0;font-size:13px}.row input,.row select{width:55%;accent-color:#e4a568}.row output{min-width:42px;text-align:right;color:#e4a568}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.buttons .btn{font-size:13px}.bottom{position:fixed;bottom:12px;left:12px;background:#101925df;border:1px solid #35465a;border-radius:11px;padding:8px 10px;font-size:11px}.note{font-size:11px;line-height:1.5;color:#aab7c6;border-top:1px solid #35465a;padding-top:10px}
</style></head><body><canvas id="c"></canvas><div id="top"><b>STORMLAB <span style="color:#e6ac72">// REBUILD</span></b><button class="btn" id="toggle">☰</button></div><div id="panel"><b>Storm environment</b><div class="row"><label>Камера</label><select id="mode"><option value="ground">С земли</option><option value="flight">Облёт</option></select></div><div class="row"><label>Детализация</label><select id="quality"><option>Low</option><option selected>Balanced</option><option>High</option></select></div><div class="row"><label>Масштаб</label><input id="zoom" type="range" min=".55" max="2.4" step=".05" value="1"><output id="zo">1.00x</output></div><div class="row"><label>Высота камеры</label><input id="height" type="range" min="0" max="100" value="8"><output id="ho">8</output></div><div class="row"><label>Ветер</label><input id="wind" type="range" min="-10" max="10" value="2"><output id="wo">2</output></div><div class="row"><label>Свет</label><input id="light" type="range" min="0" max="100" value="70"><output id="lo">70%</output></div><div class="buttons"><button class="btn" id="anim">Анимация: ON</button><button class="btn" id="flash">Молния</button><button class="btn" id="reset">Сброс</button><button class="btn" id="full">Полный экран</button><button class="btn" id="forward">▲ Вперёд</button><button class="btn" id="back">▼ Назад</button><button class="btn" id="left">◀ Влево</button><button class="btn" id="right">Вправо ▶</button></div><p class="note">Перетаскивание поворачивает камеру. В режиме облёта кнопки перемещают обзор. Это процедурная визуальная модель на Canvas 2D — WebGL не требуется.</p></div><div class="bottom" id="stat">STORMLAB · CANVAS</div>
<script>
(()=>{const c=document.querySelector('#c'),ctx=c.getContext('2d',{alpha:false}),panel=document.querySelector('#panel');let W,H,DPR=1,zoom=1,height=8,yaw=0,pitch=.06,wind=2,light=.7,anim=true,flash=0,mode='ground',offset=0,paused=false,drag=false,px=0,py=0,t0=performance.now(),seed=9234,quality=1;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};function resize(){DPR=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}window.addEventListener('resize',resize);resize();
// Multi-layer, deterministic billow fields; redraws a storm scene without GPU dependencies.
function gradientSky(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#263c59');g.addColorStop(.45,'#7b8291');g.addColorStop(.73,'#c0a38e');g.addColorStop(1,'#8a6651');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);let glow=ctx.createRadialGradient(W*.76,H*.36,2,W*.76,H*.36,H*.65);glow.addColorStop(0,`rgba(255,${Math.round(180+light*50)},${Math.round(160+light*40)},${.2+light*.22})`);glow.addColorStop(1,'rgba(255,200,150,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H)}
function blob(x,y,rx,ry,alpha,shade){let g=ctx.createRadialGradient(x-rx*.22,y-ry*.3,rx*.08,x,y,rx);g.addColorStop(0,`rgba(${shade},${shade},${shade+4},${alpha})`);g.addColorStop(.55,`rgba(${shade-15},${shade-12},${shade-7},${alpha*.82})`);g.addColorStop(.82,`rgba(${shade-30},${shade-28},${shade-22},${alpha*.6})`);g.addColorStop(1,'rgba(70,75,83,0)');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function puffField(x,y,w,h,count,seedOffset,shade,alpha,rough=1){seed=seedOffset;for(let i=0;i<count;i++){let u=rand(),v=rand(),s=rand();let px=x+(u-.5)*w,py=y+(v-.5)*h;let r=(.035+s*.095)*w*rough;blob(px,py,r,r*(.42+s*.35),alpha*(.55+s*.45),shade+Math.floor((rand()-.5)*18))}}
function cloudSystem(now){let drift=anim?now*wind*.012:offset;let cx=W*.53+Math.sin(yaw)*W*.16,cy=H*(.43-pitch*.2)-height*H*.0018;let zf=zoom*(mode==='flight'?1.35:1);ctx.save();ctx.translate(cx,cy);ctx.scale(zf,zf);ctx.translate(-cx,-cy);
// distant cloud layers
puffField(W*.48-drift*.35,H*.35,W*1.45,H*.27,150,1001,155,.18,.65);
// Shelf and lower turbulent cloud deck
puffField(W*.52-drift,H*.54,W*1.25,H*.2,130,2002,175,.32,.8);
puffField(W*.52-drift,H*.57,W*1.15,H*.15,95,3003,195,.25,1);
// Strong, uneven central convective tower with separate stacked turrets
puffField(W*.58-drift,H*.47,W*.34,H*.31,125,4004,220,.55,1.05);
puffField(W*.61-drift,H*.35,W*.24,H*.25,105,5005,235,.62,1.1);
puffField(W*.64-drift,H*.25,W*.18,H*.21,88,6006,245,.65,1.1);
puffField(W*.67-drift,H*.18,W*.13,H*.16,65,7007,250,.62,1.05);
// Broad spreading anvil: asymmetric, flattened upper canopy
puffField(W*.62-drift,H*.16,W*.7,H*.13,170,8008,238,.52,1.3);
puffField(W*.72-drift,H*.12,W*.52,H*.09,120,9009,248,.56,1.15);
// darker precipitation curtain and ragged base
puffField(W*.6-drift,H*.57,W*.42,H*.18,105,1010,115,.42,1.15);
puffField(W*.55-drift,H*.63,W*.54,H*.12,90,1111,150,.35,1.1);
// small irregular trailing fragments
puffField(W*.34-drift,H*.54,W*.36,H*.15,80,1212,165,.22,.8);
ctx.restore()}
function ground(){let y=H*.79+height*.08;let g=ctx.createLinearGradient(0,y,0,H);g.addColorStop(0,'#5a6650');g.addColorStop(.25,'#3a4837');g.addColorStop(1,'#1d2a24');ctx.fillStyle=g;ctx.fillRect(0,y,W,H-y);ctx.fillStyle='#677060';ctx.globalAlpha=.35;ctx.fillRect(0,y,W,2);ctx.globalAlpha=1;let horizon=ctx.createLinearGradient(0,y-45,0,y+40);horizon.addColorStop(0,'rgba(150,135,120,0)');horizon.addColorStop(1,'rgba(150,135,120,.4)');ctx.fillStyle=horizon;ctx.fillRect(0,y-45,W,80)}
function draw(now){let dt=Math.min((now-t0)/1000,.05);t0=now;if(anim)offset+=dt*wind*.6;flash=Math.max(0,flash-dt*2.5);gradientSky();cloudSystem(now);ground();if(flash>0){ctx.fillStyle=`rgba(230,240,255,${flash*.5})`;ctx.fillRect(0,0,W,H)}$('stat').textContent=`STORMLAB · CANVAS 2D · ${Math.round(zoom*100)}%`;requestAnimationFrame(draw)}function $(id){return document.getElementById(id)}
$('toggle').onclick=()=>panel.classList.toggle('hide');$('zoom').oninput=e=>{zoom=+e.target.value;$('zo').value=zoom.toFixed(2)+'x'};$('height').oninput=e=>{$('ho').value=e.target.value;height=+e.target.value};$('wind').oninput=e=>{wind=+e.target.value;$('wo').value=wind};$('light').oninput=e=>{light=+e.target.value/100;$('lo').value=e.target.value+'%'};$('mode').onchange=e=>mode=e.target.value;$('quality').onchange=e=>quality=e.target.selectedIndex;$('anim').onclick=()=>{anim=!anim;$('anim').textContent='Анимация: '+(anim?'ON':'OFF')};$('flash').onclick=()=>flash=1;$('reset').onclick=()=>{zoom=1;yaw=0;pitch=.06;height=8;$('zoom').value=1;$('zo').value='1.00x';$('height').value=8;$('ho').value=8};$('full').onclick=()=>document.documentElement.requestFullscreen?.();$('forward').onclick=()=>{pitch+=.025;offset+=20};$('back').onclick=()=>{pitch-=.025;offset-=20};$('left').onclick=()=>yaw-=.1;$('right').onclick=()=>yaw+=.1;c.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-px)/W; pitch+=(e.clientY-py)/H;px=e.clientX;py=e.clientY});c.addEventListener('pointerup',()=>drag=false);c.addEventListener('pointercancel',()=>drag=false);c.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.55,Math.min(2.4,zoom-e.deltaY*.001));$('zoom').value=zoom;$('zo').value=zoom.toFixed(2)+'x'},{passive:false});requestAnimationFrame(draw)})();
</script></body></html>
